<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Stylized Monogram "R" with Code Accent -->
  <text x="32" y="44" 
        font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" 
        font-size="34" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle"
        filter="url(#shadow)">R</text>

  <!-- Glowing Tech Dot -->
  <circle cx="48" cy="16" r="3.5" fill="#34d399"/>
</svg>